[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "qld-agentic-rag"
version = "2.0.0"
description = "Agentic RAG over the Queensland Road Rules (2009) and the Queensland driving handbook"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "Liuott" }]
keywords = ["rag", "langgraph", "ollama", "ragas", "queensland", "road-rules"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies. Version bounds are deliberately two-part (major.minor)
# so `pip install .` keeps working while `requirements.txt` carries the exact
# versions the experiments were produced with.
dependencies = [
  "langchain>=0.3.27,<0.4",
  "langchain-core>=0.3.76,<0.4",
  "langchain-community>=0.3.29,<0.4",
  "langchain-text-splitters>=0.3.11,<0.4",
  "langchain-ollama>=0.3.7,<0.4",
  "langchain-huggingface>=0.3.1,<0.4",
  "langchain-chroma>=0.2.5,<0.3",
  "langgraph>=0.6.7,<0.7",
  "chromadb>=1.0.20,<1.1",
  "pypdf>=6.0,<7",
  "python-dotenv>=1.1,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "tqdm>=4.67,<5",
  "numpy>=2.2,<3",
]

[project.optional-dependencies]
# Serving layer: `pip install ".[serve]"` or `uvicorn serve_api:app`
serve = ["fastapi>=0.115,<0.116", "uvicorn[standard]>=0.35,<0.36"]
# Evaluation harness (heavy: pulls datasets + ragas + langsmith)
eval = ["ragas>=0.3.4,<0.4", "datasets>=4.0,<5", "evaluate>=0.4.5,<0.5", "pandas>=2.3,<3", "langsmith>=0.4,<0.5"]
# Cross-encoder re-ranking (large: pulls torch)
rerank = ["sentence-transformers>=5.1,<6"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.12", "mypy>=1.13", "types-requests"]

[project.scripts]
qld-ingest = "src.ingest:main"
qld-ask = "src.eval.ask_one:main"
qld-agent = "src.app_graph:main"
qld-eval = "src.eval.eval_ragas:main"

[project.urls]
Homepage = "https://github.com/Liuott/qld-agentic-rag"
Issues = "https://github.com/Liuott/qld-agentic-rag/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --------------------------------------------------------------------------- #
# Linting / formatting
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "storage", "experiments", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET", "ARG", "PL", "RUF", "BLE"]
ignore = [
  "E501",    # line length handled by the formatter
  "PLR0913", # long argument lists are acceptable for eval entrypoints
  "PLR0917", # ... and so are positional-argument counts
  "PLR2004", # magic values in tests
  "B008",    # FastAPI Depends() in defaults
  "SIM108",  # ternaries are not always clearer
  "PLC0415", # lazy imports are deliberate (optional / heavy dependencies)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004", "S101", "B017", "SIM300"]
"src/eval/*" = ["ARG001", "PLR0912", "PLR0915", "BLE001", "C416", "RUF003"]
"src/rag/__init__.py" = ["PLE0605"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- #
# Tests
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

# --------------------------------------------------------------------------- #
# Type checking
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.10"
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = true
files = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["src/eval/eval_langsmith.py", "src/eval/loop_run.py"]
